name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Get version name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" "chituchik-${{ steps.tag.outputs.TAG }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "חיתוכצ'יק ${{ steps.tag.outputs.TAG }}"
          body: |
            ## חיתוכצ'יק — עורך אודיו לאנדרואיד

            ### פיצ'רים
            - עריכת אודיו **100% אופליין**
            - מצב שמור / הסר קטעים
            - ייצוא AAC או WAV | Fade In/Out | Undo/Redo
            - זום גל 30× | תצוגה מקדימה | מהירות 0.5×–2×

            ### תמיכה
            - Android 8.0+ (API 26+)
            - MP3, AAC, FLAC, OGG, WAV, OPUS ועוד

            ### התקנה
            1. הורד את קובץ ה-APK
            2. אפשר "מקורות לא ידועים" בהגדרות
            3. לחץ להתקנה
          files: "chituchik-${{ steps.tag.outputs.TAG }}.apk"
          draft: false
          prerelease: false
