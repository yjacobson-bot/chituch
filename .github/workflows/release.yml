name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          mv app/build/outputs/apk/debug/app-debug.apk chituch-${TAG}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: chituch-${{ github.ref_name }}.apk
          generate_release_notes: false
          body: |
            ## חיתוכצ'יק ${{ github.ref_name }}

            **להורדה:** לחץ על הקובץ `chituch-${{ github.ref_name }}.apk` למטה.

            דרישות: אנדרואיד 8.0+
