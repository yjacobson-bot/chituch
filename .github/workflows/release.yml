name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.4.1)'
        required: true
        default: 'v1.4.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore keystore
        run: |
          python3 -c "
          import binascii
          data = binascii.unhexlify('')
          open('app/chituch-release.jks', 'wb').write(data)
          "

      - name: Build debug APK
        run: |
          VER=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          VER=${VER#v}
          ./gradlew assembleDebug --no-daemon -PappVersionName=${VER}
        env:
          KEYSTORE_PASSWORD: chituch123

      - name: Rename APK
        run: |
          TAG=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          echo "TAG=${TAG}" >> $GITHUB_ENV
          mv app/build/outputs/apk/debug/app-debug.apk chituch-${TAG}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: חיתוכצ'יק ${{ env.TAG }}
          files: chituch-${{ env.TAG }}.apk
          generate_release_notes: false
          body: |
            ## חיתוכצ'יק ${{ env.TAG }}

            **להורדה:** לחץ על הקובץ `chituch-${{ env.TAG }}.apk` למטה.

            דרישות: אנדרואיד 8.0+
